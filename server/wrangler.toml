name = "ess-graph-repository"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Metadata. D1 is SQLite, which is what keeps this off PostgreSQL.
[[d1_databases]]
binding = "DB"
database_name = "ess-graph-repository"
database_id = "1899f8ce-ddd5-4f2f-b682-343345822733"

# Payloads. Workers KV rather than R2: R2 requires a payment method on file even
# inside its free allowance, and this deployment must stay card-free.
#
# The trade is 1 GB instead of 10 GB — roughly 1,200 graphs. That is not a
# ceiling in practice, because every computer keeps a complete local copy of the
# history; the service only has to hold a recent window, and old keys can be
# pruned without anyone losing anything.
[[kv_namespaces]]
binding = "PAYLOADS"
id = "a621608cb861487cbe656127bfdb4521"   # wrangler kv namespace create GRAPHS

[observability]
enabled = true
