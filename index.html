<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Performance and Analysis Office</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <!--
      No CDN <script> tags.

      Plotly, SheetJS and fflate are npm dependencies and are bundled, so
      fetching them from a CDN as well was both duplicated download and a
      dependency on the internet in an application that promises to work
      without it. window.Plotly was never read at all — every chart goes
      through the bundled import — so that one was pure waste.

      The two archive readers (libarchive.js, node-unrar-js) are still fetched
      from a CDN, but on demand: audit-engine only loads them when someone
      actually opens a .rar or .7z, rather than on every launch. See
      src/lib/audit-engine.js.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
